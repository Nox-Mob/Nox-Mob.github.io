name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate resume.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('src/data/resume.json', 'utf8')); console.log('resume.json is valid JSON')"

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Run tests
        run: bunx vitest run

      - name: Build
        run: bun run build

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo 'dist/index.html missing'; exit 1; }
          test -d dist/assets || { echo 'dist/assets missing'; exit 1; }
          grep -q 'src="/assets/\|src="./assets/\|src="assets/' dist/index.html \
            && echo 'asset references found in index.html'

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
